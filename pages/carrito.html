<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda en línea de productos importados de alta calidad.">
    <title>Carrito - Productos Importados</title>
   <link rel="stylesheet" href="../css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
</head>
<body>
<header>
   <div class="div-logo"><a href="../index.html"><img src="../img/logo1.jpg" alt="Importalandia"></a></div>
    <nav class="header-nav">
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="./contacto.html">Contacto</a></li>
            <li><a href="./carrito.html" class="carrito">🛒 Carrito (<span id="cart-count">0</span>)</a></li>
        </ul>
        </nav>
</header>

<main>
    <h1>Tu carrito</h1>
    <p id="carrito-vacio" hidden>Tu carrito está vacío. <a href="../index.html">Ver productos</a></p>
    <section id="carrito-contenido" class="carrito-contenido" hidden>
        <table class="tabla-carrito">
            <thead>
                <tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr>
            </thead>
            <tbody id="lista-carrito"></tbody>
        </table>
        <p class="total">Total: <strong id="total-carrito">$0</strong></p>
        <button type="button" id="vaciar-carrito">Vaciar carrito</button>
    </section>
</main>

<footer>
    <p>Sitio realizado por Andrés Lires</p>
</footer>
<script src="../js/main.js"></script>
</body>
</html>
